<head>

<title>요리 핸드북</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e8ebee;color:#142a44;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;line-height:1.7}a{color:inherit;text-underline-offset:4px}button,input,select{font:inherit}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #2568a0;outline-offset:4px}.shell{max-width:1100px;margin:30px auto;background:#f7f9fc;box-shadow:0 12px 45px #26342c13;min-height:85vh}.brand{padding:24px 5%;border-bottom:1px solid #d5dde6;display:flex;justify-content:space-between;align-items:center;gap:18px}.brand>a{font-size:23px;font-weight:750;text-decoration:none}.brand nav{font-size:14px}main{padding:30px 5% 40px}.eyebrow{font-size:14px;color:#2568a0}h1{font-size:46px;line-height:1.3;letter-spacing:-2px;margin:12px 0 18px}.intro{color:#536375;max-width:720px;white-space:pre-line}.meta{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 30px}.meta div{background:#e7eef7;border-radius:9px;padding:10px 25px;font-size:13px}.meta b{display:block;font-size:18px}.ingredients{background:#fff;padding:22px 27px 25px;border-radius:14px;margin:28px 0}h2{font-size:22px;margin:0 0 18px}.ingredient-list{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:0 40px;padding:0;margin:0 0 22px}.ingredient-list li{border-bottom:1px solid #e1e7ed;padding:11px 0}.ingredient-list label{display:flex;align-items:baseline;gap:10px;cursor:pointer}.ingredient-list b{margin-left:auto;white-space:nowrap;font-weight:600}.ingredient-list small{display:block;margin-left:28px;color:#65768a}.ingredient-list li:has(input:checked){opacity:.45;text-decoration:line-through}input[type=checkbox]{accent-color:#2568a0;width:17px;height:17px;flex-shrink:0}.prep{border-top:1px solid #e1e7ed;padding-top:18px;color:#51647a;font-size:15px}.prep h3{font-size:16px;color:#142a44;margin:0 0 8px}.prep ul{margin:0;padding-left:22px;line-height:1.9}.steps{list-style:none;margin:0;padding:0}.step{display:grid;grid-template-columns:38px 1fr;gap:14px;background:#fff;margin:0 0 14px;padding:25px;border:1px solid #dce5ee;border-radius:12px}.num{font-size:25px;font-weight:800;color:#2568a0;line-height:1.4}.step h3{font-size:20px;margin:0}.condition{display:block;color:#2568a0;font-size:14px;margin:8px 0}.step p{font-size:17px;line-height:1.95;margin:7px 0;white-space:pre-line}.step p.check{color:#33566d}.step p.caution{font-size:15px;color:#66503d}.step p.addition{font-size:14px;color:#65768a}.photo{max-width:100%;max-height:360px;display:block;object-fit:contain;border-radius:8px;margin:24px 0}details{border-top:1px solid #d5dde6;margin-top:28px;padding-top:15px;font-size:14px;color:#536375}summary{cursor:pointer}details ul{padding-left:20px;overflow-wrap:anywhere}.draft{padding:12px 16px;background:#fff4dc;border-left:3px solid #92701b;color:#694d12;margin:15px 0}.example{font-size:13px;color:#65768a}.footer{margin-top:30px;border-top:1px solid #d5dde6;padding-top:18px;font-size:13px;color:#66788a}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:25px 0}.filters input[type=search]{width:100%;background:#fff;border:1px solid #cad5e1;padding:12px 16px;border-radius:8px}.filters button,.filters select{border:1px solid #cad5e1;border-radius:6px;background:#fff;padding:8px 17px;color:#142a44;cursor:pointer}.filters button[aria-pressed=true]{background:#142a44;color:#fff;border-color:#142a44}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.recipe-card{display:block;text-decoration:none;background:#fff;border:1px solid #dce5ee;border-radius:12px;padding:22px}.recipe-card:hover{border-color:#2568a0}.recipe-card h2{font-size:23px;margin:8px 0 10px}.recipe-card p{margin:8px 0;font-size:14px;color:#65768a}.recipe-card .card-kind{font-size:13px;color:#2568a0}.recipe-card img{width:100%;height:190px;object-fit:cover;border-radius:6px;margin-bottom:14px}.empty{padding:30px 0;color:#536375}.count{font-size:14px;color:#65768a;margin-bottom:15px}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}
@media(max-width:700px){.shell{margin:12px 8px}.brand{padding:18px}.brand>a{font-size:20px}.brand nav{font-size:12px}main{padding:24px 18px}h1{font-size:37px}.meta div{padding:10px 16px}.ingredients{padding:20px}.ingredient-list{grid-template-columns:1fr}.prep{font-size:14px}.step{padding:20px 16px;grid-template-columns:27px 1fr;gap:9px}.step h3{font-size:18px}.step p{font-size:16px}.condition{font-size:13px}.cards{grid-template-columns:1fr}.filters button,.filters select{padding:8px 12px;font-size:14px}}
@media print{body{background:#fff}.shell{box-shadow:none;margin:0;min-height:0}.brand nav,.filters,.count{display:none}.ingredient-list{grid-template-columns:1fr 1fr}.step{break-inside:avoid}.ingredients{break-inside:avoid}.recipe-card{break-inside:avoid}}

.ingredient-group{margin:18px 0 0}.ingredient-group h3{font-size:16px;color:#2568a0;margin:0 0 6px}.ingredient-group ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px 24px;padding:0;margin:0}.ingredient-group li{font-size:17px;line-height:1.8}.group-qty{color:#65768a;margin-left:8px;font-size:15px}

.ingredient-table{width:100%;border-collapse:collapse;font-size:16px;text-align:left}.ingredient-table th,.ingredient-table td{padding:11px 12px;border-bottom:1px solid #e1e7ed;vertical-align:top}.ingredient-table thead th{font-size:13px;color:#65768a;font-weight:500;padding-top:0}.ingredient-table tbody+tbody{border-top:2px solid #cad5e1}.ingredient-table th[scope=rowgroup]{width:18%;color:#2568a0;font-size:15px;white-space:nowrap}.ingredient-table td:last-child{width:31%;font-weight:600}.ingredient-table tbody:last-child tr:last-child td{border-bottom:0}@media(max-width:700px){.ingredient-table{font-size:14px}.ingredient-table th,.ingredient-table td{padding:10px 6px}.ingredient-table th[scope=rowgroup]{font-size:13px}.ingredient-table td:last-child{width:32%}}

.ingredient-check{display:flex;align-items:center;gap:10px;cursor:pointer}.ingredient-check input{margin:0}.ingredient-table tr:has(input:checked) td{color:#8995a3;text-decoration:line-through}

.recipe-view{border-top:2px solid #cad5e1;margin-top:40px;padding-top:24px;scroll-margin-top:16px}html{scroll-behavior:smooth}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="shell"><main><div id="handbook-list"><h1>나의 레시피 핸드북</h1><p class="intro">다시 만들고 싶은 요리와 칵테일을 모아두는 곳.</p><div class="filters"><label class="visually-hidden" for="search">이름·재료·태그 검색</label><input id="search" type="search" placeholder="이름, 재료, 태그로 찾기"><button type="button" data-filter="all" aria-pressed="true">전체</button><button type="button" data-filter="요리" aria-pressed="false">요리</button><button type="button" data-filter="칵테일" aria-pressed="false">칵테일</button><label class="visually-hidden" for="category">분류 선택</label><select id="category"><option value="">모든 분류</option><option data-kind="요리" value="국물요리">국물요리</option><option data-kind="요리" value="면요리">면요리</option></select></div><p id="count" class="count" aria-live="polite">3개의 레시피</p><div class="cards"><a class="recipe-card" href="beef-seaweed-soup.html" data-kind="요리" data-category="국물요리" data-search="소고기 미역국 국물요리 한우 2등급 국거리 마른 미역 물 참기름 국간장 다진 마늘 액젓 소금 2인분 4인분 24cm 멀티팬 냉동"><span class="card-kind">요리 / 국물요리</span><h2>소고기 미역국</h2><p>2인분 / 4인분 (2인분 소분 냉동)</p></a><a class="recipe-card" href="sujebi.html" data-kind="요리" data-category="국물요리" data-search="손수제비 국물요리 수제비, 멸치육수, 감자, 집밥 수제비용 가루 감자 양파 대파 물 멸치 코인육수 다진 마늘 참치액 · 국간장 후추 맛소금 · 액젓 (선택)"><span class="card-kind">요리 / 국물요리</span><h2>손수제비</h2><p>사용하는 가루의 포장지 분량 기준</p></a><a class="recipe-card" href="pasta.html" data-kind="요리" data-category="면요리" data-search="토마토 새우 파스타 면요리 토마토, 새우, 파스타, 원팬 파스타 면 홀 토마토 물 생새우 진간장 설탕 소금 버터 다진 마늘"><span class="card-kind">요리 / 면요리</span><h2>토마토 새우 파스타</h2><p>1인분 / 2인분</p></a></div><p id="empty" class="empty" hidden>조건에 맞는 레시피가 없습니다. 검색어나 분류를 바꿔보세요.</p></div></main></div>
<script>
const cards=[...document.querySelectorAll('.recipe-card')];
const search=document.querySelector('#search'), category=document.querySelector('#category');
let kind='all';
function filter(){
 const q=search.value.toLocaleLowerCase().trim().split(/\s+/).filter(Boolean);
 let count=0;
 cards.forEach(card=>{
  const match=(kind==='all'||card.dataset.kind===kind)&&(!category.value||card.dataset.category===category.value)&&q.every(word=>card.dataset.search.includes(word));
  card.hidden=!match;if(match)count++;
 });
 document.querySelector('#count').textContent=count+'개의 레시피';
 document.querySelector('#empty').hidden=count!==0;
}
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{
 kind=button.dataset.filter;
 document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
 category.value='';
 [...category.options].forEach(option=>{option.hidden=!!option.dataset.kind&&kind!=='all'&&option.dataset.kind!==kind;});
 filter();
}));
search.addEventListener('input',filter);category.addEventListener('change',filter);filter();
</script>
</body>
</html>
